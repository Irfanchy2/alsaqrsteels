<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Electrode holder: glowing rod tip at top-left (the click point), jaw, insulated grip, cable. -->
  <defs>
    <radialGradient id="g" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="0.45" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="3" cy="3" r="3" fill="url(#g)"/>
  <!-- electrode rod -->
  <path d="M3 3 L11.5 11.5" stroke="#1a1d22" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M3 3 L11.5 11.5" stroke="#c9ced4" stroke-width="1.3" stroke-linecap="round"/>
  <!-- jaw -->
  <path d="M10 13.5 L13.5 10 L17 13.5 L13.5 17 Z" fill="#3a414a" stroke="#0b0d10" stroke-width="1"/>
  <!-- insulated grip -->
  <path d="M15.5 18.5 L18.5 15.5 L27 24 Q28.5 25.5 27 27 Q25.5 28.5 24 27 Z" fill="#ff5a1f" stroke="#0b0d10" stroke-width="1"/>
  <path d="M18.5 19 L19.5 18 M20.5 21 L21.5 20 M22.5 23 L23.5 22" stroke="#9a3412" stroke-width="1.2" stroke-linecap="round"/>
  <!-- cable -->
  <path d="M26.5 26.5 Q29 29 31 30" stroke="#0b0d10" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- hot tip -->
  <circle cx="3" cy="3" r="1.3" fill="#fffbe8"/>
</svg>
